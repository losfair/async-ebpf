[workspace]
# cargo-fuzz crates carry their own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[package]
name = "async-ebpf"
version = "0.4.0-alpha.8"
edition = "2021"
resolver = "2"
description = "Async-friendly, fully preemptive userspace eBPF runtime"
authors = ["Heyang Zhou <zhy20000919@hotmail.com>"]
license = "Apache-2.0"

[[bench]]
name = "bench"
harness = false
required-features = ["testing"]

[features]
default = []
testing = ["anyhow", "tokio", "rand/default"]

[dependencies]
anyhow = { version = "1", optional = true }
cfg-if = "1"
elf = "0.7"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
libc = "0.2"
memmap2 = "0.9"
parking_lot = "0.12"
rand = { version = "0.8", default-features = false }
scopeguard = "1"
thiserror = "1"
tokio = { version = "1", optional = true, features = ["full"] }
tracing = "0.1"

[dev-dependencies]
async-ebpf = { path = ".", features = ["testing"] }
criterion = { version = "0.5", features = ["async_tokio"] }
# Golden-file keys and sweep digests. Test-only: `jit::golden` is `cfg(test)`.
sha2 = "0.10"
tracing-test = "0.2"
